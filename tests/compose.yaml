# SPDX-License-Identifier: GPL-2.0-only
# Test environment: MariaDB with the Admidio tables (schema.sql), the add-ons'
# database users (users.sql) and every pgacc/*.sql and liquid/*.sql
# (grants.sh), and PHP 8.5
# for the tests (run.sh runs each tests/*-test.php in its own container). PHP
# connects through the MariaDB socket (shared volume), as the add-ons do in
# production, so the users are '<name>'@'localhost'. Test servers run in the
# PHP container on 127.0.0.1; no network access is needed.
services:
  db:
    image: mariadb:12.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    environment:
      MARIADB_ROOT_PASSWORD: test-root-password
      MARIADB_DATABASE: admidio
    volumes:
      - socket:/run/mysqld
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./users.sql:/docker-entrypoint-initdb.d/2-users.sql:ro
      - ./grants.sh:/docker-entrypoint-initdb.d/3-grants.sh:ro
      - ../pgacc:/pgacc:ro
      - ../liquid:/liquid:ro
    tmpfs:
      - /var/lib/mysql
    network_mode: none
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  php:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - socket:/run/mysqld
      - ..:/src:ro
    working_dir: /src
    network_mode: none
volumes:
  socket:
